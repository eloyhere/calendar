<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 256 256"
    width="256"
    height="256"
    role="img"
    aria-label="轩辕历法">
    <title>轩辕历法</title>

    <defs>
        <!-- 底：夜蓝，右下略深 -->
        <linearGradient id="xuan-yuan-field" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#2C4062" />
            <stop offset="1" stop-color="#131E34" />
        </linearGradient>

        <!-- 主金：罗盘圈 -->
        <linearGradient id="xuan-yuan-brass" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#FFEDB8" />
            <stop offset="0.45" stop-color="#F2C14E" />
            <stop offset="1" stop-color="#C4881A" />
        </linearGradient>

        <!-- 四正点用的小金 -->
        <linearGradient id="xuan-yuan-dot" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#FFE9AE" />
            <stop offset="1" stop-color="#D9A32C" />
        </linearGradient>

        <!-- 月晕 -->
        <radialGradient id="xuan-yuan-halo" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#F2C14E" stop-opacity="0.4" />
            <stop offset="0.55" stop-color="#F2C14E" stop-opacity="0.1" />
            <stop offset="1" stop-color="#F2C14E" stop-opacity="0" />
        </radialGradient>

        <!-- 盘面：中间略亮 -->
        <radialGradient id="xuan-yuan-dial" cx="0.5" cy="0.44" r="0.62">
            <stop offset="0" stop-color="#31456A" />
            <stop offset="1" stop-color="#1A2740" />
        </radialGradient>

        <!-- 月体：亮面朝左下内侧 -->
        <linearGradient id="xuan-yuan-moon" x1="0.15" y1="0.85" x2="0.95" y2="0.2">
            <stop offset="0" stop-color="#FFF7E2" />
            <stop offset="0.5" stop-color="#F4D68C" />
            <stop offset="1" stop-color="#D8A63A" />
        </linearGradient>

        <!-- 金属斜向高光 -->
        <linearGradient id="xuan-yuan-sheen" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.3" />
            <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.05" />
            <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
        </linearGradient>
    </defs>

    <!-- 外框：圆角方 + 金线，深色任务栏上不糊成一团 -->
    <rect
        x="6"
        y="6"
        width="244"
        height="244"
        rx="57"
        fill="url(#xuan-yuan-field)"
        stroke="url(#xuan-yuan-brass)"
        stroke-width="3.5" />

    <!-- 内描边：把金边与夜蓝分开 -->
    <rect
        x="15"
        y="15"
        width="226"
        height="226"
        rx="48"
        fill="none"
        stroke="#F2C14E"
        stroke-opacity="0.2"
        stroke-width="1.5" />

    <!-- 罗盘外圈 -->
    <circle cx="128" cy="128" r="88" fill="none" stroke="url(#xuan-yuan-brass)" stroke-width="5" />

    <!-- 四正刻度 -->
    <g fill="url(#xuan-yuan-dot)">
        <circle cx="128" cy="27" r="4.6" />
        <circle cx="229" cy="128" r="4.6" />
        <circle cx="128" cy="229" r="4.6" />
        <circle cx="27" cy="128" r="4.6" />
    </g>

    <!-- 内圈：月晕与外圈之间留一圈呼吸 -->
    <circle cx="128" cy="128" r="70" fill="none" stroke="#F2C14E" stroke-opacity="0.5" stroke-width="2" />

    <!-- 盘面 -->
    <circle cx="128" cy="128" r="64" fill="url(#xuan-yuan-dial)" />
    <circle cx="128" cy="128" r="64" fill="url(#xuan-yuan-halo)" />

    <!-- 朔望月：右缘为外圈，左侧被内弧咬出缺口 -->
    <path
        d="M151 172 A46 46 0 1 0 151 84 A34 46 0 1 1 151 172 Z"
        fill="url(#xuan-yuan-moon)" />

    <!-- 弦月内侧的一点辉光 -->
    <path
        d="M143 158 A34 34 0 0 1 143 98"
        fill="none"
        stroke="#FFFDF4"
        stroke-opacity="0.75"
        stroke-width="4"
        stroke-linecap="round" />

    <!-- 金属高光：整幅左上一抹 -->
    <path
        d="M63 6 H193 A57 57 0 0 1 250 63 V112 L6 190 V63 A57 57 0 0 1 63 6 Z"
        fill="url(#xuan-yuan-sheen)" />
</svg>
